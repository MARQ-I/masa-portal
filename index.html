// ============================================================
// CLAUDE API HELPER
// ============================================================
async function callClaude(prompt, systemPrompt = "") {
  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: "claude-sonnet-4-20250514",
      max_tokens: 1000,
      system: systemPrompt || "あなたは優秀なビジネスアナリストです。日本語で簡潔かつ実践的に回答してください。",
      messages: [{ role: "user", content: prompt }],
    }),
  });
  const data = await response.json();
  return data.content?.[0]?.text || "";
}

function exportToCSV(cards) {
  const headers = ["氏名", "役職", "会社名", "メール", "電話", "業界", "メモ"];
  const rows = cards.map(c => [c.name, c.title, c.company, c.email, c.phone, c.industry, c.notes]);
  const csv = [headers, ...rows].map(r => r.map(v => `"${v}"`).join(",")).join("\n");
  const bom = "\uFEFF";
  const blob = new Blob([bom + csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "名刺リスト.csv"; a.click();
}

function exportActionPlanCSV(plans, cardName) {
  const headers = ["優先度", "アクション", "期限", "担当", "ステータス"];
  const rows = plans.map(p => [p.priority, p.action, p.deadline, p.owner, p.status]);
  const csv = [headers, ...rows].map(r => r.map(v => `"${v}"`).join(",")).join("\n");
  const bom = "\uFEFF";
  const blob = new Blob([bom + csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href = url; a.download = `AP_${cardName}.csv`; a.click();
}

// CSV/TSV parser
function parseCSVCards(text) {
  const lines = text.split("\n").filter(l => l.trim());
  const newCards = [];
  lines.slice(1).forEach((line, idx) => {
    const parts = line.replace(/"/g, "").split(/,|\t/);
    if (parts.length >= 2 && parts[0]) {
      newCards.push({
        id: Date.now() + idx,
        name: parts[0] || "", title: parts[1] || "", company: parts[2] || "",
        email: parts[3] || "", phone: parts[4] || "", industry: parts[5] || "その他",
        notes: parts[6] || "", meetingNotes: [], actionPlans: [], companyProfile: null
      });
    }
  });
  return newCards;
}

// Claude Vision: extract business card info from image/PDF base64
async function extractCardFromImage(base64Data, mediaType) {
  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: "claude-sonnet-4-20250514",
      max_tokens: 1000,
      system: "名刺から情報を抽出し、必ずJSONのみで出力してください。前置き・後置き・説明は一切不要です。",
      messages: [{
        role: "user",
        content: [
          { type: "image", source: { type: "base64", media_type: mediaType, data: base64Data } },
          { type: "text", text: `この名刺画像から情報を抽出し、以下のJSON形式のみで出力してください（配列で複数枚対応）：
[{"name":"氏名","title":"役職","company":"会社名","email":"メールアドレス","phone":"電話番号","industry":"業界（推定）"}]
不明な項目は空文字にしてください。JSONのみ出力。` }
        ]
      }]
    })
  });
  const data = await response.json();
  const text = data.content?.[0]?.text || "[]";
  try {
    const clean = text.replace(/```json|```/g, "").trim();
    return JSON.parse(clean);
  } catch { return []; }
}

// Excel (XLSX) import via SheetJS
async function parseExcelCards(file) {
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const XLSX = window.XLSX;
        const wb = XLSX.read(e.target.result, { type: "array" });
        const ws = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(ws, { header: 1 });
        const cards = [];
        // Auto-detect header row
        let start = 0;
        for (let i = 0; i < Math.min(rows.length, 5); i++) {
          const r = rows[i].map(c => String(c || "").toLowerCase());
          if (r.some(c => c.includes("氏名") || c.includes("name") || c.includes("名前"))) { start = i + 1; break; }
        }
        rows.slice(start).forEach((row, idx) => {
          if (!row[0]) return;
          cards.push({
            id: Date.now() + idx,
            name: String(row[0] || ""), title: String(row[1] || ""), company: String(row[2] || ""),
            email: String(row[3] || ""), phone: String(row[4] || ""), industry: String(row[5] || "その他"),
            notes: String(row[6] || ""), meetingNotes: [], actionPlans: [], companyProfile: null
          });
        });
        resolve(cards);
      } catch { resolve([]); }
    };
    reader.readAsArrayBuffer(file);
  });
}

// ============================================================
// IMPORT MODAL
// ============================================================
function ImportModal({ onClose, onImport }) {
  const [mode, setMode] = useState(null); // "image"|"pdf"|"excel"|"csv"
  const [status, setStatus] = useState("idle"); // idle|loading|done|error
  const [preview, setPreview] = useState([]);
  const [msg, setMsg] = useState("");
  const fileRef = useRef();

  const MODES = [
    { id: "image", icon: "🖼️", label: "画像インポート", sub: "JPG / PNG / WEBP", accept: "image/jpeg,image/png,image/webp", color: "#00d4ff" },
    { id: "pdf",   icon: "📄", label: "PDFインポート",  sub: "名刺PDF → AI読取", accept: "application/pdf",             color: "#ff6b35" },
    { id: "excel", icon: "📊", label: "Excelインポート",sub: "XLSX / XLS / CSV",  accept: ".xlsx,.xls,.csv",            color: "#00ff94" },
  ];

  const handleFile = async (e) => {
    const file = e.target.files[0]; if (!file) return;
    setStatus("loading"); setMsg(""); setPreview([]);

    try {
      if (mode === "image") {
        setMsg("🤖 Claude Vision で名刺を読み取り中...");
        const b64 = await new Promise((res, rej) => {
          const r = new FileReader();
          r.onload = () => res(r.result.split(",")[1]);
          r.onerror = rej;
          r.readAsDataURL(file);
        });
        const mediaType = file.type || "image/jpeg";
        const extracted = await extractCardFromImage(b64, mediaType);
        if (!extracted.length) throw new Error("名刺情報を抽出できませんでした");
        const cards = extracted.map((c, i) => ({ ...c, id: Date.now() + i, notes: "", meetingNotes: [], actionPlans: [], companyProfile: null, industry: c.industry || "その他" }));
        setPreview(cards); setStatus("done");

      } else if (mode === "pdf") {
        setMsg("🤖 PDF を画像変換して AI 読み取り中...");
        const b64 = await new Promise((res, rej) => {
          const r = new FileReader();
          r.onload = () => res(r.result.split(",")[1]);
          r.onerror = rej;
          r.readAsDataURL(file);
        });
        // Send PDF directly to Claude Vision
        const response = await fetch("https://api.anthropic.com/v1/messages", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            model: "claude-sonnet-4-20250514",
            max_tokens: 1000,
            system: "名刺情報をJSONのみで出力してください。",
            messages: [{
              role: "user",
              content: [
                { type: "document", source: { type: "base64", media_type: "application/pdf", data: b64 } },
                { type: "text", text: `このPDF内の名刺情報をすべて抽出し、JSON配列のみで出力してください：
[{"name":"氏名","title":"役職","company":"会社名","email":"メールアドレス","phone":"電話番号","industry":"業界（推定）"}]` }
              ]
            }]
          })
        });
        const data = await response.json();
        const text = data.content?.[0]?.text || "[]";
        const clean = text.replace(/```json|```/g, "").trim();
        const extracted = JSON.parse(clean);
        const cards = extracted.map((c, i) => ({ ...c, id: Date.now() + i, notes: "", meetingNotes: [], actionPlans: [], companyProfile: null, industry: c.industry || "その他" }));
        setPreview(cards); setStatus("done");

      } else if (mode === "excel") {
        setMsg("📊 Excelデータを解析中...");
        // Load SheetJS dynamically
        if (!window.XLSX) {
          await new Promise((res, rej) => {
            const s = document.createElement("script");
            s.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
            s.onload = res; s.onerror = rej;
            document.head.appendChild(s);
          });
        }
        // Also handle CSV
        if (file.name.endsWith(".csv")) {
          const text = await file.text();
          const cards = parseCSVCards(text);
          setPreview(cards); setStatus("done");
        } else {
          const cards = await parseExcelCards(file);
          setPreview(cards); setStatus("done");
        }
      }
    } catch (err) {
      setStatus("error"); setMsg("エラー: " + err.message);
    }
  };

  const confirmImport = () => { onImport(preview); onClose(); };

  return (
    <div style={{ position: "fixed", inset: 0, background: "#00000099", zIndex: 200, display: "flex", alignItems: "center", justifyContent: "center" }}>
      <div style={{ background: "#07101e", border: "1px solid #1a3a5a", borderRadius: 12, width: 560, maxHeight: "80vh", overflow: "auto", padding: 28 }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 24 }}>
          <div style={{ color: "#e8f4fd", fontSize: 17, fontWeight: 700 }}>名刺インポート</div>
          <button onClick={onClose} style={{ background: "none", border: "none", color: "#4a6a8a", fontSize: 20, cursor: "pointer" }}>✕</button>
        </div>

        {/* Mode Select */}
        {!mode && (
          <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
            {MODES.map(m => (
              <button key={m.id} onClick={() => setMode(m.id)}
                style={{ background: "#0a1628", border: `1px solid ${m.color}33`, borderRadius: 8, padding: "16px 20px", cursor: "pointer", display: "flex", alignItems: "center", gap: 16, textAlign: "left" }}>
                <span style={{ fontSize: 28 }}>{m.icon}</span>
                <div>
                  <div style={{ color: m.color, fontSize: 14, fontWeight: 600 }}>{m.label}</div>
                  <div style={{ color: "#4a6a8a", fontSize: 12, marginTop: 2 }}>{m.sub}</div>
                </div>
              </button>
            ))}
          </div>
        )}

        {/* File Upload */}
        {mode && status === "idle" && (
          <div>
            <button onClick={() => setMode(null)} style={{ background: "none", border: "none", color: "#4a6a8a", cursor: "pointer", fontSize: 12, marginBottom: 16 }}>← 戻る</button>
            <div onClick={() => fileRef.current.click()}
              style={{ border: "2px dashed #1a3a5a", borderRadius: 10, padding: "40px 20px", textAlign: "center", cursor: "pointer", color: "#4a6a8a" }}>
              <div style={{ fontSize: 36, marginBottom: 10 }}>{MODES.find(m => m.id === mode)?.icon}</div>
              <div style={{ color: "#7ab8e0", fontSize: 14 }}>クリックしてファイルを選択</div>
              <div style={{ fontSize: 12, marginTop: 6 }}>{MODES.find(m => m.id === mode)?.sub}</div>
            </div>
            <input ref={fileRef} type="file" accept={MODES.find(m => m.id === mode)?.accept} style={{ display: "none" }} onChange={handleFile} />
          </div>
        )}

        {/* Loading */}
        {status === "loading" && (
          <div style={{ textAlign: "center", padding: "40px 0" }}>
            <div style={{ marginBottom: 16 }}><Spinner /></div>
            <div style={{ color: "#7ab8e0", fontSize: 13 }}>{msg}</div>
          </div>
        )}

        {/* Error */}
        {status === "error" && (
          <div style={{ background: "#2a0a0a", border: "1px solid #ff6b3544", borderRadius: 8, padding: 16, color: "#ff8855" }}>{msg}</div>
        )}

        {/* Preview */}
        {status === "done" && preview.length > 0 && (
          <div>
            <div style={{ color: "#00ff94", fontSize: 13, marginBottom: 14 }}>✓ {preview.length}件の名刺を検出しました</div>
            <div style={{ display: "flex", flexDirection: "column", gap: 8, maxHeight: 300, overflow: "auto", marginBottom: 20 }}>
              {preview.map((card, i) => (
                <div key={i} style={{ background: "#0a1628", border: "1px solid #1a2a3a", borderRadius: 6, padding: "12px 16px", display: "flex", gap: 12, alignItems: "center" }}>
                  <div style={{ width: 34, height: 34, borderRadius: 6, background: `hsl(${i * 70}deg, 60%, 22%)`, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 15, flexShrink: 0 }}>
                    {card.name?.[0] || "?"}
                  </div>
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div style={{ color: "#e8f4fd", fontSize: 13, fontWeight: 600 }}>{card.name || "—"}</div>
                    <div style={{ color: "#7ab8e0", fontSize: 11 }}>{card.title} · {card.company}</div>
                    <div style={{ color: "#4a6a8a", fontSize: 11 }}>{card.email} {card.phone}</div>
                  </div>
                  <Badge text={card.industry} color="#7ab8e0" />
                </div>
              ))}
            </div>
            <div style={{ display: "flex", gap: 10 }}>
              <button onClick={confirmImport} style={btnStyle("#00d4ff22", "#00d4ff")}>✓ インポートを確定 ({preview.length}件)</button>
              <button onClick={() => { setStatus("idle"); setPreview([]); }} style={btnStyle("#1a2a3a", "#8aacca")}>やり直す</button>
            </div>
          </div>
        )}

        {status === "done" && preview.length === 0 && (
          <div style={{ color: "#ff8855", padding: 16 }}>名刺データが見つかりませんでした。ファイルの形式を確認してください。</div>
        )}
      </div>
    </div>
  );
}

function CardManager({ cards, setCards }) {
  const [selected, setSelected] = useState(null);
  const [view, setView] = useState("grid");
  const [loading, setLoading] = useState(false);
  const [newCard, setNewCard] = useState({ name: "", title: "", company: "", email: "", phone: "", industry: "" });
  const [showAdd, setShowAdd] = useState(false);
  const [showImport, setShowImport] = useState(false);

  const handleImport = (newCards) => {
    setCards(prev => [...prev, ...newCards]);
  };

  const addCard = () => {
    if (!newCard.name || !newCard.company) return;
    setCards(prev => [...prev, { ...newCard, id: Date.now(), notes: "", meetingNotes: [], actionPlans: [], companyProfile: null }]);
    setNewCard({ name: "", title: "", company: "", email: "", phone: "", industry: "" });
    setShowAdd(false);
  };

  const selectedCard = cards.find(c => c.id === selected);

  const analyzeCompany = async (card) => {
    setLoading(true);
    const prompt = `会社名「${card.company}」に勤める「${card.title}」の「${card.name}」さんとの商談に向けて、以下を作成してください：
1. 【会社概要】（業種・推定売上・特徴 3行）
2. 【企業理念・ビジョン】（推定 2行）
3. 【商談トークポイント】（箇条書き3点、具体的に）
4. 【注意点・チャンス】（1-2行）`;
    const result = await callClaude(prompt);
    setLoading(false);
    setCards(prev => prev.map(c => c.id === card.id ? { ...c, companyProfile: result } : c));
  };

  return (
    <div style={{ padding: "24px 32px", height: "100%", overflow: "auto" }}>

          <div style={{ color: "#4a6a8a", fontSize: 12, marginTop: 2 }}>{cards.length} contacts</div>
        </div>
        <div style={{ display: "flex", gap: 10 }}>
          <button onClick={() => setShowImport(true)} style={btnStyle("#0d1f35", "#00d4ff")}>📥 インポート</button>

      </div>

              <div key={k}>
                <div style={{ color: "#4a6a8a", fontSize: 11, marginBottom: 4 }}>{l}</div>

            <div style={{ display: "flex", alignItems: "flex-start", gap: 12 }}>

              <div style={{ color: "#7ab8e0", fontSize: 13 }}>{selectedCard.title} · {selectedCard.company}</div>
            </div>
          </div>

          {/* Contact Info */}
          <div style={{ background: "#0a1628", borderRadius: 8, padding: 16, marginBottom: 16 }}>
            {[["📧", selectedCard.email], ["📞", selectedCard.phone], ["🏭", selectedCard.industry]].map(([icon, val], i) => (
              <div key={i} style={{ display: "flex", gap: 10, padding: "6px 0", color: "#8aacca", fontSize: 13 }}>
                <span>{icon}</span><span>{val}</span>

          {/* AI Analysis Button */}
          <button onClick={() => analyzeCompany(selectedCard)} style={{ ...btnStyle("#00d4ff22", "#00d4ff"), width: "100%", marginBottom: 16, justifyContent: "center" }}>
            🤖 AI企業分析・トークポイント生成

          {loading && <div style={{ marginBottom: 12 }}><Spinner /></div>}

          {/* Company Profile */}
          {selectedCard.companyProfile && (
            <div style={{ background: "#0a1628", border: "1px solid #1a3a5a", borderRadius: 8, padding: 16, marginBottom: 16 }}>
              <div style={{ color: "#00d4ff", fontSize: 12, letterSpacing: 1, marginBottom: 10 }}>AI分析レポート</div>
              <pre style={{ color: "#c0d8f0", fontSize: 12, lineHeight: 1.8, whiteSpace: "pre-wrap", margin: 0, fontFamily: "'Noto Sans JP', sans-serif" }}>

  );
}

// ============================================================
// MINUTES & ACTION PLAN
// ============================================================
function MinutesManager({ cards, setCards }) {
  const [step, setStep] = useState("list"); // list | select | input | result
  const [selectedCard, setSelectedCard] = useState(null);
  const [minutesText, setMinutesText] = useState("");
  const [loading, setLoading] = useState(false);
  const [actionPlans, setActionPlans] = useState([]);
  const fileRef = useRef();

  const handleFileImport = (e) => {
    const file = e.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => setMinutesText(ev.target.result);
    reader.readAsText(file, "UTF-8");
  };

  const generateActionPlan = async () => {
    if (!minutesText || !selectedCard) return;
    setLoading(true);
    const prompt = `以下の議事録を分析し、アクションプランをJSON配列で出力してください。
他のテキストは一切含めず、JSONのみ出力してください。

議事録：
${minutesText}

出力形式（JSONのみ）：
[{"priority":"高/中/低","action":"具体的なアクション","deadline":"YYYY-MM-DD","owner":"MASA/相手先","status":"未着手"}]`;

    const result = await callClaude(prompt, "アクションプランをJSONのみで出力してください。前置き・後置き不要。");
    setLoading(false);
    try {
      const clean = result.replace(/```json|```/g, "").trim();
      const parsed = JSON.parse(clean);
      setActionPlans(parsed);
      setStep("result");
    } catch {
      const fallback = [
        { priority: "高", action: result.slice(0, 80), deadline: "2026-03-31", owner: "MASA", status: "未着手" }
      ];
      setActionPlans(fallback);
      setStep("result");
    }
  };

  const saveToCard = () => {
    const note = { id: Date.now(), date: new Date().toLocaleDateString("ja-JP"), text: minutesText };
    setCards(prev => prev.map(c => c.id === selectedCard.id
      ? { ...c, meetingNotes: [...c.meetingNotes, note], actionPlans: [...c.actionPlans, ...actionPlans] }
      : c));
    setStep("list"); setMinutesText(""); setActionPlans([]); setSelectedCard(null);
  };

  if (step === "list") return (
    <div style={{ padding: "24px 32px" }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 24 }}>
        <h2 style={{ color: "#e8f4fd", margin: 0, fontSize: 20, fontWeight: 700 }}>議事録・アクションプラン</h2>
        <button onClick={() => setStep("select")} style={btnStyle("#00d4ff22", "#00d4ff")}>＋ 議事録を追加</button>
      </div>

      {cards.filter(c => c.actionPlans.length > 0 || c.meetingNotes.length > 0).length === 0 ? (
        <div style={{ color: "#4a6a8a", textAlign: "center", padding: "60px 0" }}>議事録はまだありません</div>
      ) : (
        <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
          {cards.filter(c => c.actionPlans.length > 0).map(card => (
            <div key={card.id} style={{ background: "#0a1628", border: "1px solid #1a2a3a", borderRadius: 8, padding: 20 }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>
                <div>
                  <span style={{ color: "#e8f4fd", fontWeight: 600 }}>{card.name}</span>
                  <span style={{ color: "#4a6a8a", fontSize: 12, marginLeft: 8 }}>{card.company}</span>
                </div>
                <button onClick={() => exportActionPlanCSV(card.actionPlans, card.name)} style={btnStyle("#0d1f35", "#00ff94")}>
                  📤 APエクスポート
                </button>
              </div>
              <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 13 }}>
                <thead>
                  <tr>{["優先度", "アクション", "期限", "担当", "状態"].map(h => (
                    <th key={h} style={{ textAlign: "left", padding: "6px 10px", color: "#4a6a8a", fontWeight: 400, borderBottom: "1px solid #1a2a3a", fontSize: 11 }}>{h}</th>
                  ))}</tr>
                </thead>
                <tbody>
                  {card.actionPlans.map((ap, i) => (
                    <tr key={i}>
                      <td style={{ padding: "8px 10px" }}><Badge text={ap.priority} color={ap.priority === "高" ? "#ff6b35" : ap.priority === "中" ? "#ffd700" : "#00ff94"} /></td>
                      <td style={{ padding: "8px 10px", color: "#c0d8f0" }}>{ap.action}</td>
                      <td style={{ padding: "8px 10px", color: "#7ab8e0", fontFamily: "monospace" }}>{ap.deadline}</td>
                      <td style={{ padding: "8px 10px", color: "#8aacca" }}>{ap.owner}</td>
                      <td style={{ padding: "8px 10px" }}><Badge text={ap.status} color="#4a6a8a" /></td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          ))}
        </div>
      )}
    </div>
  );

  if (step === "select") return (
    <div style={{ padding: "24px 32px" }}>
      <button onClick={() => setStep("list")} style={{ background: "none", border: "none", color: "#4a6a8a", cursor: "pointer", marginBottom: 16, fontSize: 13 }}>← 戻る</button>
      <h3 style={{ color: "#e8f4fd", margin: "0 0 20px" }}>関連する名刺を選択</h3>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(260px, 1fr))", gap: 12 }}>
        {cards.map(card => (
          <div key={card.id} onClick={() => { setSelectedCard(card); setStep("input"); }}
            style={{ background: "#0a1628", border: "1px solid #1a2a3a", borderRadius: 8, padding: 16, cursor: "pointer" }}>
            <div style={{ color: "#e8f4fd", fontWeight: 600 }}>{card.name}</div>
            <div style={{ color: "#4a6a8a", fontSize: 12 }}>{card.title} · {card.company}</div>
          </div>
        ))}
      </div>
    </div>
  );

  if (step === "input") return (
    <div style={{ padding: "24px 32px" }}>
      <button onClick={() => setStep("select")} style={{ background: "none", border: "none", color: "#4a6a8a", cursor: "pointer", marginBottom: 16, fontSize: 13 }}>← 戻る</button>
      <h3 style={{ color: "#e8f4fd", margin: "0 0 6px" }}>議事録入力</h3>
      <div style={{ color: "#4a6a8a", fontSize: 12, marginBottom: 20 }}>{selectedCard?.name} / {selectedCard?.company}</div>
      <div style={{ display: "flex", gap: 10, marginBottom: 14 }}>
        <button onClick={() => fileRef.current.click()} style={btnStyle("#0d1f35", "#00d4ff")}>📥 ファイルインポート</button>
        <input ref={fileRef} type="file" accept=".txt,.md" style={{ display: "none" }} onChange={handleFileImport} />
      </div>
      <textarea value={minutesText} onChange={e => setMinutesText(e.target.value)}
        placeholder="議事録をここに貼り付けるか、ファイルをインポートしてください..."
        style={{ width: "100%", background: "#0a1628", border: "1px solid #1a3a5a", borderRadius: 6, padding: 16, color: "#c0d8f0", fontSize: 13, height: 280, resize: "vertical", outline: "none", boxSizing: "border-box", lineHeight: 1.8 }} />
      <div style={{ display: "flex", gap: 10, marginTop: 14 }}>
        <button onClick={generateActionPlan} style={btnStyle("#00d4ff22", "#00d4ff")}>🤖 AIでアクションプラン生成</button>
      </div>
      {loading && <div style={{ marginTop: 12 }}><Spinner /></div>}
    </div>
  );

  if (step === "result") return (
    <div style={{ padding: "24px 32px" }}>
      <h3 style={{ color: "#e8f4fd", margin: "0 0 20px" }}>生成されたアクションプラン</h3>
      <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 13, marginBottom: 20 }}>
        <thead>
          <tr>{["優先度", "アクション", "期限", "担当", "状態"].map(h => (
            <th key={h} style={{ textAlign: "left", padding: "8px 12px", color: "#4a6a8a", fontWeight: 400, borderBottom: "1px solid #1a2a3a", fontSize: 11 }}>{h}</th>
          ))}</tr>

}

// ============================================================
// PASSWORD LOCK SCREEN
// ============================================================
const CORRECT_PASSWORD = "masa2026";

function LockScreen({ onUnlock }) {
  const [input, setInput] = useState("");
  const [error, setError] = useState(false);
  const [shake, setShake] = useState(false);
  const [attempts, setAttempts] = useState(0);
  const [locked, setLocked] = useState(false);
  const [lockTimer, setLockTimer] = useState(0);
  const inputRef = useRef();

  const handleSubmit = () => {
    if (locked) return;
    if (input === CORRECT_PASSWORD) {
      setError(false);
      onUnlock();
    } else {
      const next = attempts + 1;
      setAttempts(next);
      setError(true);
      setShake(true);
      setTimeout(() => setShake(false), 500);
      setInput("");
      inputRef.current?.focus();
      if (next >= 5) {
        setLocked(true);
        let t = 30;
        setLockTimer(t);
        const iv = setInterval(() => {
          t--;
          setLockTimer(t);
          if (t <= 0) { clearInterval(iv); setLocked(false); setAttempts(0); setError(false); }
        }, 1000);
      }
    }
  };

  return (
    <div style={{ height: "100vh", background: "#060e1a", display: "flex", alignItems: "center", justifyContent: "center", position: "relative", overflow: "hidden" }}>
      {/* Grid background effect */}
      <div style={{ position: "absolute", inset: 0, backgroundImage: "linear-gradient(#0a1e3244 1px, transparent 1px), linear-gradient(90deg, #0a1e3244 1px, transparent 1px)", backgroundSize: "40px 40px", opacity: 0.5 }} />
      {/* Radial glow */}
      <div style={{ position: "absolute", top: "50%", left: "50%", transform: "translate(-50%,-50%)", width: 600, height: 600, background: "radial-gradient(circle, #00d4ff0a 0%, transparent 70%)", pointerEvents: "none" }} />

      <div style={{
        position: "relative", zIndex: 1,
        background: "#07101e",
        border: `1px solid ${error ? "#ff6b3555" : "#1a3a5a"}`,
        borderRadius: 16,
        padding: "44px 48px",
        width: 380,
        boxShadow: `0 0 60px ${error ? "#ff6b3511" : "#00d4ff0a"}`,
        animation: shake ? "shakeLock 0.4s ease" : "fadeInUp 0.5s ease",
      }}>
        {/* Logo */}
        <div style={{ textAlign: "center", marginBottom: 36 }}>
          <div style={{ display: "inline-flex", alignItems: "center", justifyContent: "center", width: 56, height: 56, borderRadius: 14, background: "#0d1f35", border: "1px solid #1a3a5a", marginBottom: 16 }}>
            <span style={{ fontSize: 26 }}>🔐</span>
          </div>
          <div style={{ color: "#00d4ff", fontSize: 20, fontWeight: 700, letterSpacing: 3, fontFamily: "'JetBrains Mono', monospace" }}>MASA</div>
          <div style={{ color: "#2a4a6a", fontSize: 10, letterSpacing: 2.5, marginTop: 4 }}>EXECUTIVE PORTAL</div>
        </div>

        {/* Input */}
        <div style={{ marginBottom: 16 }}>
          <div style={{ color: "#4a6a8a", fontSize: 11, letterSpacing: 1.5, marginBottom: 8, textTransform: "uppercase" }}>パスワード</div>
          <input
            ref={inputRef}
            type="password"
            value={input}
            onChange={e => { setInput(e.target.value); setError(false); }}
            onKeyDown={e => e.key === "Enter" && handleSubmit()}
            disabled={locked}
            autoFocus
            placeholder={locked ? `🔒 ${lockTimer}秒後に再試行できます` : "••••••••"}
            style={{
              width: "100%",
              background: "#060e1a",
              border: `1px solid ${error ? "#ff6b35" : "#1a3a5a"}`,
              borderRadius: 8,
              padding: "12px 16px",
              color: error ? "#ff8855" : "#e8f4fd",
              fontSize: 15,
              outline: "none",
              boxSizing: "border-box",
              letterSpacing: 3,
              transition: "border-color 0.2s",
              fontFamily: "'JetBrains Mono', monospace",
            }}
          />
        </div>

        {/* Error message */}
        {error && !locked && (
          <div style={{ color: "#ff6b35", fontSize: 12, marginBottom: 14, display: "flex", alignItems: "center", gap: 6 }}>
            <span>⚠️</span> パスワードが違います（{attempts}/5回）
          </div>
        )}
        {locked && (
          <div style={{ color: "#ff6b35", fontSize: 12, marginBottom: 14, display: "flex", alignItems: "center", gap: 6 }}>
            <span>🔒</span> 試行回数超過。{lockTimer}秒後に再試行できます
          </div>
        )}

        {/* Submit */}
        <button
          onClick={handleSubmit}
          disabled={locked || !input}
          style={{
            width: "100%",
            background: locked || !input ? "#0a1628" : "#00d4ff18",
            border: `1px solid ${locked || !input ? "#1a2a3a" : "#00d4ff55"}`,
            borderRadius: 8,
            padding: "12px",
            color: locked || !input ? "#2a4a6a" : "#00d4ff",
            fontSize: 13,
            fontWeight: 600,
            cursor: locked || !input ? "not-allowed" : "pointer",
            letterSpacing: 1.5,
            fontFamily: "inherit",
            transition: "all 0.2s",
          }}>
          ログイン →
        </button>

        {/* Dots indicator */}
        <div style={{ display: "flex", justifyContent: "center", gap: 6, marginTop: 24 }}>
          {[...Array(5)].map((_, i) => (
            <div key={i} style={{ width: 6, height: 6, borderRadius: "50%", background: i < attempts ? "#ff6b35" : "#1a2a3a", transition: "background 0.2s" }} />
          ))}
        </div>
      </div>
    </div>
  );
}
